name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the prompt or tool call and the result you got.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: altinkaya-mcp version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client and OS
      placeholder: "Claude Desktop 1.2, macOS 15"
    validations:
      required: true
